name: todo_list
description: An offline Flutter task planner with SQLite persistence and classroom examples.
publish_to: none
version: 2.1.0+3
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  path: ^1.9.1
  sqflite: ^2.4.6
  sqflite_common: ^2.5.17
  sqflite_common_ffi_web: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
flutter:
  uses-material-design: true
