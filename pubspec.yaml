name: todo_list
description: An offline Flutter task planner with SQLite persistence and classroom examples.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.2
  sqflite_common: ^2.5.8
  sqflite_common_ffi_web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0
flutter:
  uses-material-design: true
